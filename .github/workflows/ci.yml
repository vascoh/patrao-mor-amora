name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://patraomor.pt' }}
          # Stub env vars for build-time static generation
          NEXT_PUBLIC_FACEBOOK_URL: ""
          NEXT_PUBLIC_INSTAGRAM_URL: ""
          NEXT_PUBLIC_YOUTUBE_URL: ""
          NEXT_PUBLIC_WHATSAPP_NUMBER: "351912345678"

  deploy-preview:
    name: Netlify Preview Deploy
    runs-on: ubuntu-latest
    needs: lint-typecheck-build
    if: github.event_name == 'pull_request'
    steps:
      - name: Trigger Netlify build hook
        if: vars.NETLIFY_BUILD_HOOK_URL != ''
        run: |
          curl -X POST -d '{}' "${{ vars.NETLIFY_BUILD_HOOK_URL }}"
